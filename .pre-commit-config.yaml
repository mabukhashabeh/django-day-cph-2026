# Copy-paste stack from the talk.
# Order is the point: cheap hygiene → formatters → linters → Django.

default_stages: [pre-commit]
default_language_version:
  python: python3.12

exclude: >
  (?x)^(
    .*\.min\.js|
    .*\.min\.css|
    fixtures/broken/.*
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-case-conflict
      - id: check-symlinks
      - id: debug-statements
      - id: detect-private-key
      - id: check-ast
      - id: check-builtin-literals
      - id: name-tests-test
        args: [--pytest-test-first]
        exclude: ^catalog/tests/conftest\.py$

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.19.1
    hooks:
      - id: pyupgrade
        args: [--py311-plus]

  - repo: https://github.com/PyCQA/autoflake
    rev: v2.3.1
    hooks:
      - id: autoflake
        args:
          - --in-place
          - --remove-unused-variables
          - --remove-all-unused-imports
          - --expand-star-imports

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black", "--line-length", "88"]

  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        args: [--line-length=88]

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.2
    hooks:
      - id: flake8
        args:
          - --max-line-length=88
          - --max-complexity=12
          - --extend-ignore=E203,W503
        exclude: (^catalog/migrations/|^shop/settings\.py$)

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
        exclude: (^catalog/tests/|^catalog/migrations/)

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        additional_dependencies: [django-stubs, types-requests]
        args: [--ignore-missing-imports, --disable-error-code=var-annotated]
        exclude: (^catalog/migrations/)

  - repo: local
    hooks:
      - id: django-system-check
        name: django-system-check
        entry: python manage.py check
        language: python
        additional_dependencies: ["django>=5.1,<6.0"]
        pass_filenames: false
        always_run: true
      - id: django-unmigrated-models
        name: django-unmigrated-models
        entry: python manage.py makemigrations --check --dry-run
        language: python
        additional_dependencies: ["django>=5.1,<6.0"]
        pass_filenames: false
        always_run: true
